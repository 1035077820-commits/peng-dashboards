function getWeek(dateStr){
  // dateStr like "2025-07-03" or "2025/7/3" etc
  let d=new Date(dateStr.replace(/\//g,'-'));
  let day=d.getDate();
  if(day<=6) return 1;
  if(day<=13) return 2;
  if(day<=20) return 3;
  if(day<=27) return 4;
  return 5;
}

  let hotVhHtml='';
  allVh.slice(0,3).forEach((v,i)=>{
    hotVhHtml+=`<div class="hot-card"><div class="title"><span class="rank-${i+1}">#${i+1}</span> ${v['视频描述']||'无标题'}</div>
    <div class="stats">账号: <span>${v.account}</span> | 播放: <span>${v['播放量']}</span> | 点赞: <span>${v['喜欢']||0}</span> | 完播率: <span>${v['完播率']||'-'}</span> | 关注: <span>${v['关注量']||0}</span></div></div>`;
  });
  document.getElementById('hot-vh').innerHTML=hotVhHtml;

  // Hot content XHS
  let allXhs=[];
  for(let k in xhs) xhs[k].forEach(v=>allXhs.push({...v,account:k}));
  allXhs.sort((a,b)=>(b['曝光']||0)-(a['曝光']||0));
  let hotXhsHtml='';
  allXhs.slice(0,3).forEach((v,i)=>{
    hotXhsHtml+=`<div class="hot-card"><div class="title"><span class="rank-${i+1}">#${i+1}</span> ${v['笔记标题']||'无标题'}</div>
    <div class="stats">账号: <span>${v.account}</span> | 曝光: <span>${v['曝光']}</span> | 观看: <span>${v['观看量']||0}</span> | 点赞: <span>${v['点赞']||0}</span> | 涨粉: <span>${v['涨粉']||0}</span></div></div>`;
  });
  document.getElementById('hot-xhs').innerHTML=hotXhsHtml;

  // VH Detail Table
  let tVh='<tr><th>排名</th><th>账号</th><th>发布数</th><th>总播放</th><th>总点赞</th><th>总评论</th><th>总分享</th><th>总关注</th><th>场均播放</th></tr>';
  vhRank.forEach((v,i)=>{
    let d=vh[v.name];
    let likes=d.reduce((s,x)=>s+Number(x["喜欢"]||0),0);
    let comments=d.reduce((s,x)=>s+Number(x["评论量"]||0),0);
    let shares=d.reduce((s,x)=>s+Number(x["分享量"]||0),0);
    let follows=d.reduce((s,x)=>s+Number(x["关注量"]||0),0);
    tVh+=`<tr><td class="rank-${i<3?i+1:''}">${i+1}</td><td>${v.name}</td><td>${d.length}</td><td>${v.views}</td><td>${likes}</td><td>${comments}</td><td>${shares}</td><td>${follows}</td><td>${Math.round(v.views/d.length)}</td></tr>`;
  });
  document.getElementById('table-vh').innerHTML=tVh;

  // XHS Detail Table
  let tXhs='<tr><th>排名</th><th>账号</th><th>发布数</th><th>总曝光</th><th>总观看</th><th>总点赞</th><th>总收藏</th><th>总涨粉</th><th>场均曝光</th></tr>';
  xhsRank.forEach((v,i)=>{
    let d=xhs[v.name];
    let views=d.reduce((s,x)=>s+Number(x["观看量"]||0),0);
    let likes=d.reduce((s,x)=>s+Number(x["点赞"]||0),0);
    let saves=d.reduce((s,x)=>s+Number(x["收藏"]||0),0);
    let follows=d.reduce((s,x)=>s+Number(x["涨粉"]||0),0);
    tXhs+=`<tr><td class="rank-${i<3?i+1:''}">${i+1}</td><td>${v.name}</td><td>${d.length}</td><td>${v.expo}</td><td>${views}</td><td>${likes}</td><td>${saves}</td><td>${follows}</td><td>${Math.round(v.expo/d.length)}</td></tr>`;
  });
  document.getElementById('table-xhs').innerHTML=tXhs;
}
</script>
</body>
