<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓝队培训文件</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 48px 24px; }
        .header {
            text-align: center;
            margin-bottom: 48px;
        }
        .header h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header p { color: #94a3b8; font-size: 16px; }
        .modules {
            display: grid;
            gap: 20px;
        }
        .module-card {
            display: block;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 28px 32px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
        }
        .module-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59,130,246,0.15);
        }
        .module-card h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 8px;
        }
        .module-card p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
        }
        .module-card .tag {
            display: inline-block;
            background: #334155;
            color: #3b82f6;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 12px;
        }
        .footer {
            text-align: center;
            margin-top: 48px;
            color: #475569;
            font-size: 13px;
        }
    </style>
<script>(function(){var h='3ada92f28b4ceda38562ebf047c6ff05400d4c572352a1142eedfef67d21e662';var k=localStorage.getItem('peng_dash_key');if(k===h)return;var p=prompt('请输入访问密码：');if(!p){document.body.innerHTML='<h1 style="text-align:center;margin-top:40vh;color:#fff">需要密码才能访问</h1>';return;}var s=Array.from(new Uint8Array(new TextEncoder().encode(p)));crypto.subtle.digest('SHA-256',new Uint8Array(s)).then(function(buf){var hash=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');if(hash===h){localStorage.setItem('peng_dash_key',h)}else{document.body.innerHTML='<h1 style="text-align:center;margin-top:40vh;color:#fff">密码错误</h1>'}})})();</script></head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔵 蓝队培训文件</h1>
            <p></p>
        </div>
        <div class="modules">
            <a class="module-card" href="新客户开发/index.html">
                <h2>📋 新客户开发</h2>
                <p>客户筛选方法论、背调流程、CRM资料收集规范、信息采集模板、合作切入策略。从10000个客户中筛出值得服务的200个。</p>
                <span class="tag">核心必修</span>
            </a>
            <a class="module-card" href="26年全年数据分析/index.html">
                <h2>📈 26年全年数据分析</h2>
                <p>团队冲刺激励会 · 目标拆解 · 奖金方案 · 下半年打法</p>
                <span class="tag">数据驱动</span>
            </a>
            <!-- 后续可继续添加更多模块 -->
        </div>
        <div class="footer">
            捷展贸易 · 蓝队 · 2026
        </div>
    </div>
</body>
</html>
