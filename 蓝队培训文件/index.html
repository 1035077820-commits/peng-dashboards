<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓝队培训文件</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 48px 24px; }
        .header {
            text-align: center;
            margin-bottom: 48px;
        }
        .header h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header p { color: #94a3b8; font-size: 16px; }
        .modules {
            display: grid;
            gap: 20px;
        }
        .module-card {
            display: block;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 28px 32px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
        }
        .module-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59,130,246,0.15);
        }
        .module-card h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 8px;
        }
        .module-card p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
        }
        .module-card .tag {
            display: inline-block;
            background: #334155;
            color: #3b82f6;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 12px;
        }
        .footer {
            text-align: center;
            margin-top: 48px;
            color: #475569;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔵 蓝队培训文件</h1>
            <p>捷展国际事业部 · 金队销售团队培训资料库</p>
        </div>
        <div class="modules">
            <a class="module-card" href="新客户开发/index.html">
                <h2>📋 新客户开发</h2>
                <p>客户背调方法论、CRM资料收集规范、信息采集模板、合作切入策略。从零开始教你如何高效调研一个新客户。</p>
                <span class="tag">核心必修</span>
            </a>
            <!-- 后续可继续添加更多模块 -->
        </div>
        <div class="footer">
            捷展贸易 · 蓝队 · 2026
        </div>
    </div>
</body>
</html>
