<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>施从富 - 3月绩效</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#1e293b;padding:24px;max-width:600px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.sub{color:#64748b;font-size:13px;margin-bottom:24px}
.card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin-bottom:16px}
.card .label{font-size:12px;color:#64748b;margin-bottom:4px}
.card .value{font-size:32px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.good .value{color:#34d399} .warn .value{color:#fbbf24} .bad .value{color:#f87171} .neutral .value{color:#60a5fa}
.detail{font-size:13px;color:#475569;line-height:2}
.back{display:inline-block;margin-top:20px;color:#3b82f6;text-decoration:none;font-size:14px}
</style></head><body>
<h1>施从富</h1>
<p class="sub">2026年3月 绩效报告</p>
<div class="grid">
  <div class="card warn"><div class="label">⏱️ 时效</div><div class="value">1.80</div><div style="font-size:11px;color:#94a3b8">小时/款</div></div>
  <div class="card neutral"><div class="label">📐 总产出</div><div class="value">114</div><div style="font-size:11px;color:#94a3b8">款</div></div>
  <div class="card good"><div class="label">头版出错率</div><div class="value">0.0%</div><div style="font-size:11px;color:#94a3b8">0错/73款</div></div>
  <div class="card bad"><div class="label">放码出错率</div><div class="value">12.2%</div><div style="font-size:11px;color:#94a3b8">5错/41款</div></div>
</div>
<div class="card">
  <div class="label">📋 数据明细</div>
  <div class="detail">
    工作时长：205.5 小时<br>
    头复版数：73 款<br>
    放码数：41 款<br>
    总产出：114 款<br>
    时效：205.5 ÷ 114 = <b>1.80 小时/款</b>
  </div>
</div>
<a class="back" href="index.html">← 返回总看板</a>
</body></html>
