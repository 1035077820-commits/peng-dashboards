<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="销售工作台入口：订单跟进、大货管理、客户管理与业务员待办。">
  <meta name="referrer" content="no-referrer">
  <title>销售工作台 · 彭培强的在线系统</title>
  <style>
    :root { color-scheme: dark; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 28px 20px; color: #edf4ff; background: radial-gradient(ellipse at 15% 10%, #223e65 0, transparent 55%), #0c1626; }
    main { width: 100%; max-width: 680px; padding: 48px; border: 1px solid #35465f; border-radius: 24px; background: #142238; box-shadow: 0 24px 80px #0004; }
    .eyebrow { margin: 0 0 28px; color: #94b6e2; font-size: 14px; letter-spacing: .12em; }
    h1 { margin: 0 0 18px; font-size: clamp(32px, 7vw, 44px); letter-spacing: -.03em; }
    .intro { margin: 0; color: #b6c8df; line-height: 1.9; font-size: 16px; }
    ul { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; padding: 0; margin: 28px 0 36px; }
    li { border: 1px solid #3c506c; border-radius: 8px; padding: 8px 12px; color: #ccdaec; font-size: 14px; }
    a { color: #b6d3ff; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #a8ccff; outline-offset: 5px; }
    .primary { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; padding: 18px 22px; border-radius: 12px; background: #b7d4ff; color: #112744; font-size: 17px; font-weight: 700; text-decoration: none; }
    .primary:hover { background: #d0e3ff; }
    .destination { margin: 14px 0 30px; color: #a6b9d2; font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
    footer { padding-top: 24px; border-top: 1px solid #34465e; font-size: 14px; }
    @media (max-width: 480px) { main { padding: 32px 24px; border-radius: 18px; } .eyebrow { margin-bottom: 24px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">彭培强的在线系统</p>
    <h1>销售工作台</h1>
    <p class="intro">把订单进度、客户跟进和日常待办，放在同一个工作台。</p>
    <ul aria-label="系统功能">
      <li>订单跟进</li><li>大货管理</li><li>客户管理</li><li>业务员待办</li>
    </ul>
    <a class="primary" href="https://sales.hoooe.top/" rel="noreferrer">进入销售工作台 <span aria-hidden="true">→</span></a>
    <p class="destination">前往 sales.hoooe.top，使用现有系统账号登录。</p>
    <footer><a href="/peng-dashboards/">← 返回在线系统首页</a></footer>
  </main>
</body>
</html>
